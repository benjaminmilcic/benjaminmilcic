<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="538" viewBox="0 0 1000 538"
     role="img" aria-label="Benjamin Milčić — Full Stack Developer, Angular · NestJS · Ionic. Available for projects. 10+ years experience, 20+ projects.">
  <title>Benjamin Milčić — Full Stack Developer</title>
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fed7aa"/>
      <stop offset="50%"  stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity=".45"/>
      <stop offset="28%"  stop-color="#fff" stop-opacity=".15"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="screw" cx="30%" cy="30%" r="78%">
      <stop offset="0%"   stop-color="#cbd5e1"/>
      <stop offset="55%"  stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <filter id="lift" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity=".3"/>
    </filter>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .live { animation: none; } }
  </style>

  <!-- ── enamel sign ── -->
  <g filter="url(#lift)">
    <rect x="50" y="18" width="900" height="384" rx="28"
          fill="url(#enamel)" stroke="#9a3412" stroke-width="5"/>
    <rect x="52.5" y="20.5" width="895" height="379" rx="26" fill="url(#gloss)"/>
  </g>

  <!-- corner screws -->
  <g transform="translate(78 46) rotate(18)">
    <circle r="12" fill="url(#screw)"/>
    <path d="M-6 0h12" stroke="#0f172a" stroke-opacity=".65" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(922 46) rotate(-34)">
    <circle r="12" fill="url(#screw)"/>
    <path d="M-6 0h12" stroke="#0f172a" stroke-opacity=".65" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(78 374) rotate(62)">
    <circle r="12" fill="url(#screw)"/>
    <path d="M-6 0h12" stroke="#0f172a" stroke-opacity=".65" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g transform="translate(922 374) rotate(-12)">
    <circle r="12" fill="url(#screw)"/>
    <path d="M-6 0h12" stroke="#0f172a" stroke-opacity=".65" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- availability -->
  <g>
    <rect x="372" y="58" width="256" height="30" rx="15" fill="#fff" fill-opacity=".38"
          stroke="#7c2d12" stroke-opacity=".2"/>
    <circle cx="396" cy="73" r="7.5" fill="#16a34a" fill-opacity=".28"/>
    <circle class="live" cx="396" cy="73" r="4" fill="#16a34a"/>
    <text x="411" y="77.5" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="12" font-weight="600"
          letter-spacing="2.1" fill="#7c2d12">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- name -->
  <text x="500" y="176" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="72"
        font-weight="600" letter-spacing="-1.4" fill="#0c4a6e">Benjamin <tspan
        font-style="italic">Milčić</tspan></text>

  <!-- role -->
  <text x="500" y="222" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="28"
        font-style="italic" fill="#7c2d12">Full Stack Developer</text>

  <!-- stack -->
  <g>
    <rect x="382" y="242" width="236" height="30" rx="15" fill="#fff" fill-opacity=".42"
          stroke="#7c2d12" stroke-opacity=".2"/>
    <text x="500" y="262" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="13"
          fill="#9a3412">Angular · NestJS · Ionic</text>
  </g>

  <!-- claim -->
  <g>
    <rect x="140" y="294" width="720" height="76" rx="16" fill="#fff" fill-opacity=".3"/>
    <text x="500" y="323" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="17"
          font-weight="600" fill="#0c4a6e">Passionate developer with 10+ years of experience,</text>
    <text x="500" y="348" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="17"
          font-weight="600" fill="#0c4a6e">turning ideas into elegant, functional solutions.</text>
  </g>

  <!-- ── the numbers ── -->
  <g>
    <rect x="50" y="428" width="290" height="98" rx="16" fill="#0f172a"/>
    <rect x="50.5" y="428.5" width="289" height="97" rx="15.5"
          fill="none" stroke="#94a3b8" stroke-opacity=".18"/>
    <text x="195" y="478" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="40"
          font-weight="600" fill="#fbbf24">10+</text>
    <rect x="181" y="490" width="28" height="2.5" rx="1.25" fill="#fb923c" fill-opacity=".7"/>
    <text x="195" y="514" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11"
          letter-spacing="2" fill="#94a3b8">YEARS EXPERIENCE</text>
  </g>
  <g>
    <rect x="355" y="428" width="290" height="98" rx="16" fill="#0f172a"/>
    <rect x="355.5" y="428.5" width="289" height="97" rx="15.5"
          fill="none" stroke="#94a3b8" stroke-opacity=".18"/>
    <text x="500" y="478" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="40"
          font-weight="600" fill="#fbbf24">20+</text>
    <rect x="486" y="490" width="28" height="2.5" rx="1.25" fill="#fb923c" fill-opacity=".7"/>
    <text x="500" y="514" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11"
          letter-spacing="2" fill="#94a3b8">PROJECTS</text>
  </g>
  <g>
    <rect x="660" y="428" width="290" height="98" rx="16" fill="#0f172a"/>
    <rect x="660.5" y="428.5" width="289" height="97" rx="15.5"
          fill="none" stroke="#94a3b8" stroke-opacity=".18"/>
    <text x="805" y="478" text-anchor="middle" font-family="Georgia,'Fraunces','Times New Roman',serif" font-size="40"
          font-weight="600" fill="#fbbf24">100%</text>
    <rect x="791" y="490" width="28" height="2.5" rx="1.25" fill="#fb923c" fill-opacity=".7"/>
    <text x="805" y="514" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',Consolas,monospace" font-size="11"
          letter-spacing="2" fill="#94a3b8">PASSION</text>
  </g>
</svg>
